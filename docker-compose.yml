services:
  # 生产形态：定稿闸门产出的静态构建，由 nginx 托管
  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "4173:80"
  # 本地开发服务器：docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/srv/web
      - frontend_node_modules:/srv/web/node_modules

volumes:
  frontend_node_modules:
